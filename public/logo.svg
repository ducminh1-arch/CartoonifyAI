<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E93" />
      <stop offset="50%" stop-color="#FF8A00" />
      <stop offset="100%" stop-color="#7928CA" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFD600" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <circle cx="256" cy="230" r="130" fill="#FFE0B2" stroke="#2D1B08" stroke-width="12" />
  <!-- Anime / Caricature Eyes -->
  <ellipse cx="205" cy="210" rx="30" ry="42" fill="#1A1A2E" />
  <ellipse cx="307" cy="210" rx="30" ry="42" fill="#1A1A2E" />
  <circle cx="195" cy="195" r="12" fill="#FFFFFF" />
  <circle cx="215" cy="225" r="6" fill="#FFFFFF" />
  <circle cx="297" cy="195" r="12" fill="#FFFFFF" />
  <circle cx="317" cy="225" r="6" fill="#FFFFFF" />
  <!-- Cheeks -->
  <circle cx="170" cy="245" r="22" fill="#FF8BA7" opacity="0.6" />
  <circle cx="342" cy="245" r="22" fill="#FF8BA7" opacity="0.6" />
  <!-- Smile -->
  <path d="M 215 260 Q 256 310 297 260" stroke="#2D1B08" stroke-width="10" stroke-linecap="round" fill="#FF4757" />
  <!-- Hair / Hat -->
  <path d="M 126 230 C 120 120, 200 90, 256 90 C 312 90, 392 120, 386 230 C 350 170, 310 160, 256 160 C 202 160, 162 170, 126 230 Z" fill="#2D1B08" />
  <!-- Wand / Camera Star Magic -->
  <path d="M 400 80 L 415 130 L 465 145 L 415 160 L 400 210 L 385 160 L 335 145 L 385 130 Z" fill="url(#sparkleGrad)" filter="url(#glow)" />
  <circle cx="100" cy="120" r="10" fill="#FFFFFF" opacity="0.8" />
  <circle cx="80" cy="380" r="14" fill="#FFFFFF" opacity="0.8" />
</svg>
